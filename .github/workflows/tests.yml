name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Seed the purchase database (git-ignored, so built in CI)
        run: python eval/purchases/db.py --seed
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
