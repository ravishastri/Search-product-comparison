      - generic [ref=f3070e285]:
        - heading "Licensing explained" [level=2] [ref=f3070e286]
        - generic [ref=f3070e287]:
          - generic [ref=f3070e288]:
            - generic [ref=f3070e289]:
              - heading "Free plan for up to 10 users" [level=3] [ref=f3070e290]
              - paragraph [ref=f3070e291]: The YouTrack free plan is for teams of up to 10 users and comes with 30 GB of storage. It provides all of the functionality available with paid subscriptions except for a custom logo, which is only available with paid subscriptions.
            - generic [ref=f3070e292]:
              - heading "AI Assistant" [level=3] [ref=f3070e293]
              - paragraph [ref=f3070e294]:
                - text: All YouTrack Cloud customers, including small teams using YouTrack for free and YouTrack Server customers with active subscriptions, have access to free credits for AI-powered features. These credits are replenished weekly. Later on, we’re planning to offer additional credits purchases for teams who need more than the free amount.
                - link "Learn more↗" [ref=f3070e295] [cursor=pointer]:
                  - /url: https://youtrack-support.jetbrains.com/hc/en-us/sections/15618044333330-YouTrack-AI-Assistant
                - text: about credits for generative AI in YouTrack.
            - generic [ref=f3070e296]:
              - heading "Paid subscriptions for 11+ users and 4+ support agents" [level=3] [ref=f3070e297]
              - paragraph [ref=f3070e298]: You can switch seamlessly from a free plan or trial to a paid subscription at any time and keep all your current YouTrack data.
              - paragraph [ref=f3070e299]: The more users you have, the less you pay per user. Monthly subscription prices start from $5.40 per user/month for 11 users, and gradually decrease to $1.83/ per user/month for 10,000 users. With an annual subscription, you save 2 months worth of costs. Annual subscription prices start from $4.50 and decrease to $1.53 per user/month.
              - paragraph [ref=f3070e300]: If you use YouTrack Helpdesk, the price per agent is fixed at $6 per agent/month for monthly subscriptions and at $5.50 per agent/month for an annual subscription for support teams of 4 support agents or more.
            - generic [ref=f3070e301]:
              - heading "YouTrack Helpdesk pricing" [level=3] [ref=f3070e302]
              - paragraph [ref=f3070e303]: You can start using YouTrack Helpdesk for free with 3 support agents and unlimited reporters – customers who submit tickets. If you need 4 or more support agents, you can switch to a paid monthly or annual subscription. Each support agent also requires a user license. For example, if your team consists of 30 members and 25 of them are regular users and 5 are support agents, you will pay for 30 users and 5 support agents for your YouTrack subscription.
          - generic [ref=f3070e304]:
            - generic [ref=f3070e305]:
              - heading "Monthly subscription" [level=3] [ref=f3070e306]
              - paragraph [ref=f3070e307]: With a monthly subscription, you pay at the end of each month for the maximum number of active user accounts in your YouTrack during that month. Banned user accounts are not included in the billing calculation.
            - generic [ref=f3070e308]:
              - heading "Annual subscription" [level=3] [ref=f3070e309]
              - paragraph [ref=f3070e310]: With an annual subscription, you pay in advance to use YouTrack with a fixed number of users at a discounted rate. While your subscription is active, you can add up to 50% more users. You will be billed for these additional users at the end of the 12-month subscription period. Billing for additional users is calculated at the standard monthly subscription rate and is only applied to active users. Banned users are not included in the billing calculation.
              - paragraph [ref=f3070e311]:
                - text: Post-paid users are available as long as you have a valid payment method assigned to your YouTrack subscription. Contact the
                - link "sales team" [ref=f3070e312] [cursor=pointer]:
                  - /url: /support/sales/#email-sales
                - text: to learn more.
              - img "YouTrack Pricing" [ref=f3070e314]
              - paragraph [ref=f3070e315]:
                - text: If you purchase an annual YouTrack Cloud subscription from a JetBrains reseller, you cannot add post-paid users to your subscription. To add more permanent users at any time, please contact your reseller or the JetBrains
                - link "sales team" [ref=f3070e316] [cursor=pointer]:
                  - /url: /support/sales/#email-sales
                - text: .
            - generic [ref=f3070e317]:
              - heading "Storage capacity" [level=3] [ref=f3070e318]
              - paragraph [ref=f3070e319]: 1 user = 3 GB
              - paragraph [ref=f3070e320]: The YouTrack free plan comes with 30 GB of storage. With paid subscriptions, you get 3 GB of storage per user.
              - paragraph [ref=f3070e321]: You can’t purchase extra storage separately, but you can increase your storage allowance by adding more users to your subscription.
          - generic [ref=f3070e322]:
            - generic [ref=f3070e323]:
              - 'heading "Free trial: 14 days with 100 users" [level=3] [ref=f3070e324]'
              - paragraph [ref=f3070e325]: Once you’ve registered a free YouTrack plan for up to 10 users, you can start a 14-day trial with up to 100 users, 50 support agents, and 100 GB of disk space to see how YouTrack works at scale. No credit card required.
              - paragraph [ref=f3070e326]: After the 14-day trial period expires, your YouTrack will return to the free plan with 10 users and three support agents.
              - paragraph [ref=f3070e327]: Any additional users created during the trial are saved for 30 days. You can upgrade to a paid subscription and continue working with all the users and data you added at any time during the trial and up to 30 days after it ends.
            - generic [ref=f3070e328]:
              - heading "Legacy Cloud subscriptions" [level=3] [ref=f3070e329]
              - paragraph [ref=f3070e330]:
                - text: If you have a legacy Cloud subscription (with packages of users), you can no longer renew it under the legacy pricing. Your current subscription will remain valid until its expiration date. To continue using your YouTrack after that point, you’ll be asked to switch to a per-user subscription – either monthly or annual. We offer an extra three months for free when you switch to an annual per-user subscription. Learn more on our
                - link "blog" [ref=f3070e331] [cursor=pointer]:
                  - /url: https://blog.jetbrains.com/youtrack/2025/06/new-youtrack-prices-starting-from-october-2025/
                - text: .
            - generic [ref=f3070e332]:
              - heading "Migration from Cloud to YouTrack Server" [level=3] [ref=f3070e333]
              - paragraph [ref=f3070e334]: YouTrack Cloud instances are hosted and maintained by JetBrains in our secure cloud infrastructure.
              - paragraph [ref=f3070e335]: You can migrate all of your data from YouTrack Cloud to YouTrack Server at any time.
            - generic [ref=f3070e336]:
              - heading "Backups in case of inactivity" [level=3] [ref=f3070e337]
              - paragraph [ref=f3070e338]: "If you don't use your YouTrack for a while, it will be automatically removed. The timeframe for removal depends on your plan: 1.5 months for trial plans, 3.5 months for free plans, and 6.5 months for paid plans. We'll keep a backup of your data for up to 6 months after removal, just in case you decide to return."
