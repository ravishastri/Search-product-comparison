            - img "accenture"
          - generic [ref=f3034e2830]:
            - generic [ref=f3034e2834]: "I'm honestly just running away from Jira and its thousand-plugin circus. What I really want is simple: subtasks that behave like actual children of a task, not thousands of separate issues flooding my board like they do in Jira. I loveeee Plane where subtasks stay neatly under their parent, have their own work logs, and let me choose different subtask types so easily."
