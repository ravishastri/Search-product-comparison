        - heading "Plane is independently audited and certified" [level=3] [ref=f3034e2843]
        - generic [ref=f3034e2844]: across cloud and self-hosted deployments for four popular compliance standards.
      - 'img "Compliance certifications: GDPR, HIPAA, ISO 27001, and SOC 2" [ref=f3034e2847]'
    - generic [ref=f3034e2868]:
      - heading "What can we answer for you today?" [level=2] [ref=f3034e2871]
      - generic [ref=f3034e2872]:
        - generic [ref=f3034e2873]:
          - button "What is Plane?" [ref=f3034e2874] [cursor=pointer]
          - generic: Plane is an open-source project management tool that helps teams collaborate, track progress, and deliver projects efficiently. It combines project management, wiki, and intake forms in one unified platform.
        - generic [ref=f3034e2881]:
          - button "Is Plane free to use?" [ref=f3034e2882] [cursor=pointer]
          - generic: Yes, Plane offers a generous free tier with core features. We also have paid plans for advanced features, enterprise needs, and priority support.
        - generic [ref=f3034e2889]:
          - button "Can I self-host Plane?" [ref=f3034e2890] [cursor=pointer]
          - generic: Absolutely! Plane is open-source and can be self-hosted on your own infrastructure for complete control and privacy. We provide comprehensive documentation and support for self-hosting.
        - generic [ref=f3034e2897]:
          - button "What integrations does Plane support?" [ref=f3034e2898] [cursor=pointer]
          - generic: Plane integrates with popular tools like GitHub, GitLab, Slack, Discord, and many more to streamline your workflow and keep your team connected.
        - generic [ref=f3034e2905]:
          - button "How do I migrate from other project management tools?" [ref=f3034e2906] [cursor=pointer]
          - generic: We provide migration tools and support to help you move from tools like Jira, Asana, Trello, or Linear to Plane. Our team can assist with the migration process.
        - generic [ref=f3034e2913]:
          - button "Is my data secure?" [ref=f3034e2914] [cursor=pointer]
          - generic: Security is our top priority. We use industry-standard encryption, regular security audits, and follow best practices to protect your data. For self-hosted instances, you have complete control over your data.
