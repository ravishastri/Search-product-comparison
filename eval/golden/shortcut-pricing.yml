          - heading "The Shortcut Nonprofit Plan" [level=3] [ref=f3040e838]
          - paragraph [ref=f3040e839]: Shortcut is free for qualifying nonprofits. Thank you for the hard work your team does to make the world a better place.
          - link "Apply Now" [ref=f3040e841] [cursor=pointer]:
            - /url: https://forms.gle/nEycYUu6MFB7EP5AA
