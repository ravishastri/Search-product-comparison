  - generic [ref=f3040e805]:
    - heading "Frequently Asked Questions" [level=2] [ref=f3040e806]
    - paragraph [ref=f3040e807]: Some questions about Shortcut are asked frequently. We've answered the most frequent of those frequent questions below.
    - generic [ref=f3040e808]:
      - generic [ref=f3040e809]:
        - heading "What can I expect each billing cycle if I'm on the yearly Team or Business Plan?" [level=3] [ref=f3040e810]
        - paragraph [ref=f3040e811]: For these plans, we use metered billing, which means we charge you per user, per month during your yearly billing cycle.
      - generic [ref=f3040e812]:
        - heading "We want to cancel our subscription. Can we get a refund?" [level=3] [ref=f3040e813]
        - paragraph [ref=f3040e814]: Shortcut does not offer pro-rated refunds for cancelled subscriptions.
      - generic [ref=f3040e815]:
        - heading "How do I add a credit card in Shortcut?" [level=3] [ref=f3040e816]
        - paragraph [ref=f3040e817]: To add a credit card, go to Settings > Workspace > Billing, and update your billing information in the Card section. It's always a good idea to review and update your billing contact information while you're there.
      - generic [ref=f3040e818]:
        - heading "What happens when the trial period ends?" [level=3] [ref=f3040e819]
        - paragraph [ref=f3040e820]: If you have 10 or fewer users when the trial ends, you can simply use Shortcut for free or manually choose one of our paid plans to get access to the features included within it. If you have more than 10 users and want to continue using Shortcut after your trial ends, subscribe to one of our paid plans.
      - generic [ref=f3040e821]:
        - heading "Do I have to wait until the end of the trial to subscribe to a paid plan?" [level=3] [ref=f3040e822]
        - paragraph [ref=f3040e823]: Nope! You are welcome to add a credit card at any time, but you won't be charged until your 14-day Trial is over.
      - generic [ref=f3040e824]:
        - heading "What can I do in Shortcut during the 14-day trial period?" [level=3] [ref=f3040e825]
        - paragraph [ref=f3040e826]: "Anything! The Shortcut Trial is meant to give you an opportunity to truly test Shortcut's features and to build processes that work for your team. You'll have full access to Shortcut as a robust tool, including (but definitely not limited to): an Organization with unlimited Workspaces and user management, unlimited Observer users, our API, and outgoing webhooks. Feel free to experiment with using Teams, Epics and Objectives, Stories, Labels, and Custom Workflows together to create a project management environment unique and useful to your team."
    - paragraph [ref=f3040e827]:
      - text: For more billing information, check out our
      - link "Help Center" [ref=f3040e828] [cursor=pointer]:
        - /url: /help
      - text: .
  - generic [ref=f3040e830]:
    - heading "But wait, there's more...." [level=2] [ref=f3040e831]
    - paragraph [ref=f3040e832]: Shortcut is honored to extend a full membership at no cost to eligible Nonprofit organizations as thanks for the hard work.
